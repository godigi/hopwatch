name: "Feature Request"
description: "Suggest an idea or improvement for Hopwatch"
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Hopwatch better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Gap"
      description: "Is your feature request related to a problem or diagnostic blind spot?"
      placeholder: "e.g. When experiencing Wi-Fi roaming latency spikes, there is no probe that measures..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the diagnostic check, CLI flag, or UI improvement you'd like to see."
      placeholder: "e.g. Add a probe for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you've considered."
